
name: Publicar experiencias autorizadas

on:
  repository_dispatch:
    types: [ge_publicar_experiencias]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar y actualizar experiencias públicas
        env:
          EXPERIENCIAS_JSON: ${{ github.event.client_payload.experiencias }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("EXPERIENCIAS_JSON", "")
          data = json.loads(raw)

          if not isinstance(data, list):
              raise SystemExit("El contenido debe ser una lista JSON.")

          allowed = {
              "titulo", "resumen", "historia",
              "tipo", "metodologia", "unidad"
          }

          clean = []
          for item in data:
              if not isinstance(item, dict):
                  raise SystemExit("Registro inválido.")

              clean.append({
                  key: str(item.get(key, ""))
                  for key in allowed
              })

          Path("data").mkdir(exist_ok=True)
          Path("data/experiencias.json").write_text(
              json.dumps(clean, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experiencias.json
          git diff --cached --quiet || git commit -m "Actualizar experiencias públicas"
          git push
