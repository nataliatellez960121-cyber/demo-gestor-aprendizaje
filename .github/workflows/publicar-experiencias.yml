name: Publicar experiencias autorizadas

on:
  repository_dispatch:
    types: [ge_iniciar_sincronizacion, ge_publicar_experiencias]

permissions:
  contents: write

# Cada lote tiene su propio grupo. Así GitHub no cancela los eventos pendientes
# de otros lotes de la misma sincronización.
concurrency:
  group: publicar-experiencias-${{ github.event.client_payload.sync_id }}-${{ github.event.client_payload.lote_index || github.event.action }}
  cancel-in-progress: false

env:
  SYNC_ID: ${{ github.event.client_payload.sync_id }}
  LOTE_INDEX: ${{ github.event.client_payload.lote_index }}
  TOTAL_LOTES: ${{ github.event.client_payload.total_lotes }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar datos del evento
        id: validar
        run: |
          if [ -z "$SYNC_ID" ]; then
            echo "Falta client_payload.sync_id." >&2
            exit 1
          fi
          if [ "${{ github.event.action }}" = "ge_publicar_experiencias" ]; then
            if [ -z "$LOTE_INDEX" ] || [ -z "$TOTAL_LOTES" ]; then
              echo "El lote debe incluir lote_index y total_lotes." >&2
              exit 1
            fi
            if [ "$LOTE_INDEX" -lt 0 ] || [ "$TOTAL_LOTES" -lt 1 ] || [ "$LOTE_INDEX" -ge "$TOTAL_LOTES" ]; then
              echo "lote_index debe ir de 0 a total_lotes - 1." >&2
              exit 1
            fi
            if [ "$LOTE_INDEX" -eq "$((TOTAL_LOTES - 1))" ]; then
              echo "is_last=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_last=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Guardar payload del lote
        if: github.event.action == 'ge_publicar_experiencias'
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD_JSON" > "$RUNNER_TEMP/payload.json"

      - name: Preparar rama de estado
        if: github.event.action == 'ge_publicar_experiencias'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin sync-state >/dev/null 2>&1; then
            git fetch origin sync-state
            git checkout -B sync-state origin/sync-state
          else
            git checkout --orphan sync-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p ".sync-state/$SYNC_ID"

      - name: Guardar lote independiente
        if: github.event.action == 'ge_publicar_experiencias'
        run: |
          python3 scripts/sync_experiencias.py lote \
            --state-dir ".sync-state/$SYNC_ID" \
            --lote-index "$LOTE_INDEX" \
            --payload-file "$RUNNER_TEMP/payload.json"
          git add ".sync-state/$SYNC_ID/lote_$(printf '%04d' "$LOTE_INDEX").json"
          git commit -m "Guardar lote $LOTE_INDEX de sincronización $SYNC_ID"
          for intento in 1 2 3 4 5 6 7 8; do
            if git push origin sync-state; then
              exit 0
            fi
            if git ls-remote --exit-code --heads origin sync-state >/dev/null 2>&1; then
              git fetch origin sync-state
              git checkout -B sync-state origin/sync-state
              python3 scripts/sync_experiencias.py lote \
                --state-dir ".sync-state/$SYNC_ID" \
                --lote-index "$LOTE_INDEX" \
                --payload-file "$RUNNER_TEMP/payload.json"
              git add ".sync-state/$SYNC_ID/lote_$(printf '%04d' "$LOTE_INDEX").json"
              git commit -m "Guardar lote $LOTE_INDEX de sincronización $SYNC_ID"
            fi
            sleep $((intento * 2))
          done
          echo "No se pudo guardar el lote en sync-state." >&2
          exit 1

      - name: Esperar a que estén todos los lotes
        if: github.event.action == 'ge_publicar_experiencias' && steps.validar.outputs.is_last == 'true'
        run: |
          completos=false
          for intento in $(seq 1 60); do
            git fetch origin sync-state
            git reset --hard origin/sync-state
            faltantes=0
            for indice in $(seq 0 $((TOTAL_LOTES - 1))); do
              archivo=".sync-state/$SYNC_ID/lote_$(printf '%04d' "$indice").json"
              [ -f "$archivo" ] || faltantes=$((faltantes + 1))
            done
            if [ "$faltantes" -eq 0 ]; then
              completos=true
              break
            fi
            echo "Aún faltan $faltantes lotes. Intento $intento/60."
            sleep 10
          done
          if [ "$completos" != true ]; then
            echo "Tiempo agotado: no llegaron todos los lotes." >&2
            exit 1
          fi
          python3 scripts/sync_experiencias.py finalizar \
            --state-dir ".sync-state/$SYNC_ID" \
            --total-lotes "$TOTAL_LOTES" \
            --final-output "$RUNNER_TEMP/experiencias.final.json"

      - name: Publicar conjunto completo en main
        if: github.event.action == 'ge_publicar_experiencias' && steps.validar.outputs.is_last == 'true'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/experiencias.final.json" data/experiencias.json
          git add data/experiencias.json
          if git diff --cached --quiet; then
            echo "El conjunto publicado ya está actualizado."
            exit 0
          fi
          git commit -m "Sincronizar experiencias públicas autorizadas ($SYNC_ID)"
          for intento in 1 2 3 4 5 6 7 8; do
            if git push origin main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((intento * 2))
          done
          echo "No se pudo publicar data/experiencias.json." >&2
          exit 1
