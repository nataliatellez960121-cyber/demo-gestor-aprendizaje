name: Publicar experiencias autorizadas

on:
  repository_dispatch:
    types: [ge_iniciar_sincronizacion, ge_publicar_lote, ge_publicar_experiencias]

permissions:
  contents: write

# Los lotes de una misma sincronización se coordinan por sync_id/lote.
# Las publicaciones individuales usan un grupo único por ejecución.
concurrency:
  group: publicar-experiencias-${{ github.event.client_payload.sync_id || github.run_id }}-${{ github.event.client_payload.lote_index || github.event.action }}
  cancel-in-progress: false

env:
  SYNC_ID: ${{ github.event.client_payload.sync_id }}
  LOTE_INDEX: ${{ github.event.client_payload.lote_index }}
  TOTAL_LOTES: ${{ github.event.client_payload.total_lotes }}
  EVENT_TYPE: ${{ github.event.action }}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verificar archivos requeridos
        run: |
          test -f scripts/sync_experiencias.py

      - name: Conservar script de sincronización
        run: cp scripts/sync_experiencias.py "$RUNNER_TEMP/sync_experiencias.py"

      - name: Validar datos del evento
        id: validar
        run: |
          if [ "$EVENT_TYPE" = "ge_iniciar_sincronizacion" ] || [ "$EVENT_TYPE" = "ge_publicar_lote" ]; then
            if [ -z "$SYNC_ID" ]; then
              echo "Falta client_payload.sync_id." >&2
              exit 1
            fi
          fi
          if [ "$EVENT_TYPE" = "ge_publicar_lote" ]; then
            if [ -z "$LOTE_INDEX" ] || [ -z "$TOTAL_LOTES" ]; then
              echo "El lote debe incluir lote_index y total_lotes." >&2
              exit 1
            fi
            if [ "$LOTE_INDEX" -lt 0 ] || [ "$TOTAL_LOTES" -lt 1 ] || [ "$LOTE_INDEX" -ge "$TOTAL_LOTES" ]; then
              echo "lote_index debe ir de 0 a total_lotes - 1." >&2
              exit 1
            fi
            if [ "$LOTE_INDEX" -eq "$((TOTAL_LOTES - 1))" ]; then
              echo "is_last=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_last=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Guardar payload del evento
        if: github.event.action == 'ge_publicar_lote' || github.event.action == 'ge_publicar_experiencias'
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          printf '%s' "$PAYLOAD_JSON" > "$RUNNER_TEMP/payload.json"

      # Publicación individual: conserva el conjunto existente y actualiza solo
      # la experiencia recibida. Nunca reemplaza el archivo completo.
      - name: Actualizar una experiencia individual
        if: github.event.action == 'ge_publicar_experiencias'
        run: |
          python3 - "$RUNNER_TEMP/payload.json" <<'PY'
          import json, sys, pathlib, re
          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          data = payload.get("experiencias", [])
          while isinstance(data, str):
              data = json.loads(data)
          if isinstance(data, dict):
              data = [data]
          if not isinstance(data, list):
              raise SystemExit("El evento individual debe contener una experiencia o una lista.")
          fields = ["titulo", "resumen", "historia", "tipo", "metodologia", "unidad", "autores", "correoContacto"]
          def clean(v):
              if isinstance(v, dict):
                  v = v.get("Value", v.get("value", ""))
              if isinstance(v, list):
                  v = ", ".join(str(clean(x)) for x in v if clean(x) not in ("", None))
              return re.sub(r"\s+", " ", str(v or "").replace("\xa0", " ")).strip()
          path = pathlib.Path("data/experiencias.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          existing = json.loads(path.read_text(encoding="utf-8")) if path.exists() else []
          by_key = {}
          for old in existing:
              key = "titulo:" + clean(old.get("titulo")).casefold()
              by_key[key] = {f: clean(old.get(f, "")) for f in fields}
          for raw in data:
              if not isinstance(raw, dict):
                  continue
              record = {f: clean(raw.get(f, "")) for f in fields}
              if not record["titulo"] or not record["resumen"] or not record["historia"]:
                  raise SystemExit("La experiencia no tiene título, resumen o historia.")
              key = "titulo:" + record["titulo"].casefold()
              by_key[key] = record
          result = sorted(by_key.values(), key=lambda x: x["titulo"].casefold())
          path.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(f"Publicación individual aplicada. Total en archivo: {len(result)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experiencias.json
          git commit -m "Actualizar experiencia autorizada desde SharePoint" || exit 0
          for intento in 1 2 3 4 5 6 7 8; do
            if git push origin main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((intento * 2))
          done
          echo "No se pudo publicar la experiencia individual." >&2
          exit 1

      - name: Preparar rama de estado
        if: github.event.action == 'ge_publicar_lote'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin sync-state >/dev/null 2>&1; then
            git fetch origin sync-state
            git checkout -B sync-state origin/sync-state
          else
            git checkout --orphan sync-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p ".sync-state/$SYNC_ID"

      - name: Guardar lote independiente
        if: github.event.action == 'ge_publicar_lote'
        run: |
          python3 "$RUNNER_TEMP/sync_experiencias.py" lote \
            --state-dir ".sync-state/$SYNC_ID" \
            --lote-index "$LOTE_INDEX" \
            --payload-file "$RUNNER_TEMP/payload.json"
          git add ".sync-state/$SYNC_ID/lote_$(printf '%04d' "$LOTE_INDEX").json"
          git commit -m "Guardar lote $LOTE_INDEX de sincronización $SYNC_ID"
          for intento in 1 2 3 4 5 6 7 8; do
            if git push origin sync-state; then exit 0; fi
            if git ls-remote --exit-code --heads origin sync-state >/dev/null 2>&1; then
              git fetch origin sync-state
              git checkout -B sync-state origin/sync-state
              python3 "$RUNNER_TEMP/sync_experiencias.py" lote \
                --state-dir ".sync-state/$SYNC_ID" \
                --lote-index "$LOTE_INDEX" \
                --payload-file "$RUNNER_TEMP/payload.json"
              git add ".sync-state/$SYNC_ID/lote_$(printf '%04d' "$LOTE_INDEX").json"
              git commit -m "Guardar lote $LOTE_INDEX de sincronización $SYNC_ID"
            fi
            sleep $((intento * 2))
          done
          echo "No se pudo guardar el lote en sync-state." >&2
          exit 1

      - name: Esperar a que estén todos los lotes
        if: github.event.action == 'ge_publicar_lote' && steps.validar.outputs.is_last == 'true'
        run: |
          completos=false
          for intento in $(seq 1 60); do
            git fetch origin sync-state
            git reset --hard origin/sync-state
            faltantes=0
            for indice in $(seq 0 $((TOTAL_LOTES - 1))); do
              archivo=".sync-state/$SYNC_ID/lote_$(printf '%04d' "$indice").json"
              [ -f "$archivo" ] || faltantes=$((faltantes + 1))
            done
            if [ "$faltantes" -eq 0 ]; then completos=true; break; fi
            echo "Aún faltan $faltantes lotes. Intento $intento/60."
            sleep 10
          done
          if [ "$completos" != true ]; then
            echo "Tiempo agotado: no llegaron todos los lotes." >&2
            exit 1
          fi
          python3 "$RUNNER_TEMP/sync_experiencias.py" finalizar \
            --state-dir ".sync-state/$SYNC_ID" \
            --total-lotes "$TOTAL_LOTES" \
            --final-output "$RUNNER_TEMP/experiencias.final.json"

      - name: Publicar conjunto completo en main
        if: github.event.action == 'ge_publicar_lote' && steps.validar.outputs.is_last == 'true'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          cp "$RUNNER_TEMP/experiencias.final.json" data/experiencias.json
          git add data/experiencias.json
          if git diff --cached --quiet; then
            echo "El conjunto publicado ya está actualizado."
            exit 0
          fi
          git commit -m "Sincronizar experiencias públicas autorizadas ($SYNC_ID)"
          for intento in 1 2 3 4 5 6 7 8; do
            if git push origin main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            sleep $((intento * 2))
          done
          echo "No se pudo publicar data/experiencias.json." >&2
          exit 1
