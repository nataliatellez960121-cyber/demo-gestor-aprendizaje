name: Sincronizar experiencias públicas completas

on:
  repository_dispatch:
    types: [ge_sincronizar_experiencias]

permissions:
  contents: write

concurrency:
  group: sincronizar-experiencias-completas
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar y reconstruir el conjunto público
        env:
          PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          payload = json.loads(os.environ["PAYLOAD_JSON"])
          raw = payload.get("experiencias", [])
          if isinstance(raw, str):
              raw = json.loads(raw)
          if not isinstance(raw, list):
              raise SystemExit("El campo experiencias debe ser una lista.")

          fields = ("titulo", "resumen", "historia", "tipo", "metodologia", "unidad")
          def plain(value):
              if isinstance(value, dict):
                  value = value.get("Value", value.get("value", ""))
              if isinstance(value, list):
                  value = ", ".join(filter(None, (plain(x) for x in value)))
              value = "" if value is None else str(value)
              return re.sub(r"\\s+", " ", value.replace("\\xa0", " ")).strip().rstrip(";").strip()

          unique = {}
          for item in raw:
              if not isinstance(item, dict):
                  continue
              record = {key: plain(item.get(key, "")) for key in fields}
              if not all(record[key] for key in ("titulo", "resumen", "historia")):
                  continue
              identity = str(item.get("id") or item.get("Id") or item.get("ID") or record["titulo"].casefold())
              unique[identity] = record

          records = sorted(unique.values(), key=lambda x: x["titulo"].casefold())
          Path("data/experiencias.json").write_text(
              json.dumps(records, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8"
          )
          print(f"Conjunto público reconstruido: {len(records)} historias únicas.")
          PY

      - name: Publicar conjunto completo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/experiencias.json
          if git diff --cached --quiet; then
            echo "El conjunto ya coincide con SharePoint; no hay cambios."
            exit 0
          fi
          git commit -m "Sincronizar conjunto completo de experiencias públicas"
          git push origin HEAD:main
